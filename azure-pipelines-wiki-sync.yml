# Azure DevOps Pipeline to sync wiki folder from GitHub to Azure DevOps Wiki repo
# This pipeline triggers on every commit to main in the GitHub repository

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - wiki/*

# Use the GitHub connection
resources:
  repositories:
    - repository: github-source
      type: github
      endpoint: YOUR_GITHUB_SERVICE_CONNECTION_NAME  # Replace with your GitHub service connection name
      name: YOUR_ORG/YOUR_REPO  # Replace with your GitHub org/repo (e.g., voltbc/volt-factory)

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Replace these with your actual values
  azureDevOpsOrg: 'VoltBC'
  azureDevOpsProject: 'Factory'
  wikiRepoName: 'Factory.wiki'  # Typically ProjectName.wiki
  wikiFolder: 'wiki'
  commitUserName: 'Wiki Sync Bot'
  commitUserEmail: 'wiki-sync@voltbc.dev'

steps:
  # Checkout the GitHub repository
  - checkout: github-source
    persistCredentials: false
    clean: true

  # Clone the Azure DevOps wiki repository
  - task: Bash@3
    displayName: 'Clone Azure DevOps Wiki Repository'
    inputs:
      targetType: 'inline'
      script: |
        # Configure git
        git config --global user.name "$(commitUserName)"
        git config --global user.email "$(commitUserEmail)"

        # Clone the wiki repository using system access token
        git clone https://$(System.AccessToken)@dev.azure.com/$(azureDevOpsOrg)/$(azureDevOpsProject)/_git/$(wikiRepoName) wiki-repo

        echo "Wiki repository cloned successfully"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Sync wiki content
  - task: Bash@3
    displayName: 'Sync Wiki Content'
    inputs:
      targetType: 'inline'
      script: |
        # Remove old content from wiki repo (except .git)
        cd wiki-repo
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

        # Copy new content from GitHub wiki folder
        cp -r ../$(wikiFolder)/* .

        # Check if there are any changes
        if [[ -n $(git status -s) ]]; then
          echo "Changes detected, committing..."
          git add -A
          git commit -m "Auto-sync from GitHub - Build $(Build.BuildNumber)

          Source commit: $(Build.SourceVersion)
          Triggered by: $(Build.Reason)"

          # Push changes back to Azure DevOps
          git push origin HEAD:main

          echo "Wiki synchronized successfully"
        else
          echo "No changes detected, skipping commit"
        fi
